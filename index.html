<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup Generator | PrintSim Studio</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>

<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <div class="brand-logo">
                <img src="assets/logo.png" alt="Logo" class="logo-image">
                <span class="brand-name">Mockup Generator</span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" id="view-3d-btn">View in 3D →</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar removed -->

        <!-- Left Panel (Tools & Options) -->
        <div class="left-panel">
            <div class="panel-content">
                <!-- Upload Section -->
                <div class="section">
                    <h3 class="section-title">Upload images</h3>
                    <div class="upload-area" id="drop-zone">
                        <input type="file" id="file-upload" accept="image/png, image/jpeg, image/jpg" hidden>
                        <label for="file-upload" class="upload-label">
                            <div class="upload-icon">
                                <!-- Icon: Image Upload -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />
                                    <polyline points="21 15 16 10 5 21" />
                                </svg>
                            </div>
                            <span class="upload-text">Touch to Upload</span>
                        </label>
                    </div>
                </div>

                <!-- View Selector -->
                <div class="section">
                    <h3 class="section-title">Perspective</h3>
                    <div class="view-selector">
                        <button class="view-btn active" data-view="front">
                            Front
                        </button>
                        <button class="view-btn" data-view="back">
                            Back
                        </button>
                    </div>
                </div>

                <!-- Color Selector -->
                <div class="section">
                    <h3 class="section-title">Garment Color</h3>
                    <div class="color-grid">
                        <div class="color-option white active" data-color="white" title="White"></div>
                        <div class="color-option black" data-color="black" title="Black"></div>
                    </div>
                </div>

                <!-- Anime Collection -->
                <div class="section">
                    <h3 class="section-title">Anime Graphics</h3>
                    <div class="presets-grid">
                        <div class="preset-item" data-src="assets/gojo.jpg">
                            <img src="assets/gojo.jpg" alt="Gojo">
                        </div>
                        <div class="preset-item" data-src="assets/gojo 2.jpg">
                            <img src="assets/gojo 2.jpg" alt="Gojo 2">
                        </div>
                        <div class="preset-item" data-src="assets/zenitsu.jpg">
                            <img src="assets/zenitsu.jpg" alt="Zenitsu">
                        </div>
                        <div class="preset-item" data-src="assets/demon slayer.jpg">
                            <img src="assets/demon slayer.jpg" alt="Demon Slayer">
                        </div>
                        <div class="preset-item" data-src="assets/anime-3.png">
                            <img src="assets/anime-3.png" alt="Pirate">
                        </div>
                        <div class="preset-item" data-src="assets/preset-2.svg">
                            <img src="assets/preset-2.svg" alt="Retro">
                        </div>
                    </div>
                </div>

                <!-- Streetwear & Brands -->
                <div class="section">
                    <h3 class="section-title">Streetwear Elements</h3>
                    <div class="presets-grid">
                        <div class="preset-item" data-src="assets/nike-logo.png">
                            <img src="assets/nike-logo.png" alt="Nike">
                        </div>
                        <div class="preset-item" data-src="assets/adidas-logo.png">
                            <img src="assets/adidas-logo.png" alt="Adidas">
                        </div>
                        <div class="preset-item" data-src="assets/Balenciaga-logo.png">
                            <img src="assets/Balenciaga-logo.png" alt="Balenciaga">
                        </div>
                        <div class="preset-item" data-src="assets/levis-logo.png">
                            <img src="assets/levis-logo.png" alt="Levi's">
                        </div>
                        <div class="preset-item" data-src="assets/us-polo-logo.png">
                            <img src="assets/us-polo-logo.png" alt="US Polo">
                        </div>
                        <div class="preset-item" data-src="assets/pepe-jeans-logo.svg">
                            <img src="assets/pepe-jeans-logo.svg" alt="Pepe Jeans">
                        </div>
                        <div class="preset-item" data-src="assets/louis vuitton logo.png">
                            <img src="assets/louis vuitton logo.png" alt="Louis Vuitton">
                        </div>
                        <div class="preset-item" data-src="assets/H&M logo.png">
                            <img src="assets/H&M logo.png" alt="H&M">
                        </div>
                        <div class="preset-item" data-src="assets/brand-1.png">
                            <img src="assets/brand-1.png" alt="Athletic">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <main class="main-canvas">
            <div class="canvas-container">
                <canvas id="tshirt-canvas" width="500" height="600"></canvas>
            </div>

            <!-- Right Tools (Consolidated Dock) -->
            <div class="right-tools">
                <button class="tool-btn active-tool" id="select-tool" title="Select">
                    <!-- Icon: Cursor -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                    </svg>
                </button>
                <button class="tool-btn" id="pan-tool" title="Pan">
                    <!-- Icon: Hand -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                        <path
                            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15">
                        </path>
                    </svg>
                </button>

                <div class="tool-divider"></div>

                <button class="tool-btn" id="zoom-in" title="Zoom In">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </button>
                <button class="tool-btn" id="zoom-out" title="Zoom Out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                </button>
                <button class="tool-btn" id="fit-screen" title="Fit to Screen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>

                <div class="tool-divider"></div>

                <button class="tool-btn danger" id="reset-btn" title="Clear Design">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>

                <div class="tool-divider"></div>

                <button class="tool-btn action-primary" id="download-btn" title="Download">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
